<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>역사 서바이버</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 인게임 HUD -->
  <div id="hud" class="hidden">
    <div id="xpbar"><div id="xpfill"></div><span id="lvtext">Lv 1</span></div>
    <div id="hudrow">
      <div class="hud-box" id="hud-era">선사 시대</div>
      <div class="hud-box big" id="hud-time">00:00</div>
      <div class="hud-box" id="hud-kills">💀 0</div>
      <div class="hud-box" id="hud-quiz">📖 0 / 0</div>
    </div>
    <div id="hpwrap"><div id="hpfill"></div><span id="hptext">100 / 100</span></div>
    <div id="inv"></div>
    <div id="hud-btns">
      <button id="btn-mute" title="소리 켜기/끄기">🔊</button>
      <button id="btn-pause" title="일시정지 (Esc)">⏸</button>
    </div>
  </div>

  <div id="banner" class="hidden"><div id="banner-title"></div><div id="banner-sub"></div></div>

  <!-- 타이틀 -->
  <div id="screen-title" class="screen">
    <div class="panel title-panel">
      <div class="logo">⚔️ 역사 서바이버</div>
      <p class="tagline">초등 5학년 2학기 사회 · 한국사 단원에 맞춘 역사 퀴즈 서바이벌!</p>
      <div class="row">
        <span class="label">배운 단원</span>
        <div id="unit-btns" class="seg">
          <button data-unit="1">1단원</button>
          <button data-unit="2">1~2단원</button>
          <button data-unit="3">1~3단원</button>
        </div>
      </div>
      <p id="unit-desc" class="small"></p>
      <div class="row">
        <span class="label">난이도</span>
        <div id="level-btns" class="seg">
          <button data-level="1">기본</button>
          <button data-level="2">도전</button>
        </div>
      </div>
      <p id="level-desc" class="small"></p>
      <div class="label hero-label">캐릭터 선택</div>
      <div id="hero-list" class="heroes"></div>
      <div id="hero-info" class="hero-info">
        <canvas id="hero-portrait" class="portrait"></canvas>
        <div class="hero-text">
          <div class="hero-name"><b id="hero-name"></b> <span id="hero-title"></span></div>
          <div id="hero-desc" class="hero-desc"></div>
          <div class="hero-tags"><span id="hero-weapon" class="tag era"></span><span id="hero-perk" class="tag"></span></div>
        </div>
      </div>
      <ul class="howto">
        <li><b>이동</b> — WASD / 방향키, 모바일은 화면을 드래그</li>
        <li><b>공격</b> — 무기가 자동으로 공격해요</li>
        <li><b>레벨 업</b> — 역사 퀴즈를 맞히면 강화 3개 중 선택, 틀리면 1개만!</li>
        <li><b>목표</b> — 배운 단원의 시대들을 지나 <b>6분</b> 동안 살아남기</li>
      </ul>
      <button id="btn-start" class="primary">게임 시작 (Enter)</button>
      <div class="small mode">모드: 솔로</div>
    </div>
  </div>

  <!-- 퀴즈 -->
  <div id="screen-quiz" class="screen hidden">
    <div class="panel quiz-panel">
      <div class="quiz-head">
        <span id="quiz-tag" class="tag">레벨 업!</span>
        <span id="quiz-era" class="tag era"></span>
        <span id="quiz-timer" class="tag timer hidden"></span>
      </div>
      <div id="quiz-q" class="quiz-q"></div>
      <div id="quiz-choices" class="choices"></div>
      <div id="quiz-result" class="result hidden">
        <div id="quiz-verdict"></div>
        <div id="quiz-exp"></div>
        <button id="quiz-next" class="primary">계속 (Enter)</button>
      </div>
    </div>
  </div>

  <!-- 강화 선택 -->
  <div id="screen-upgrade" class="screen hidden">
    <div class="panel up-panel">
      <div id="up-title" class="up-title"></div>
      <div id="up-cards" class="cards"></div>
    </div>
  </div>

  <!-- 일시정지 -->
  <div id="screen-pause" class="screen hidden">
    <div class="panel">
      <div class="logo small-logo">일시정지</div>
      <div id="pause-inv" class="pause-inv"></div>
      <button id="btn-resume" class="primary">계속하기 (Esc)</button>
      <button id="btn-quit">처음으로</button>
    </div>
  </div>

  <!-- 결과 -->
  <div id="screen-over" class="screen hidden">
    <div class="panel over-panel">
      <div id="over-title" class="logo small-logo"></div>
      <div id="over-sub" class="tagline"></div>
      <div id="over-stats" class="stats"></div>
      <div id="over-std-wrap" class="hidden">
        <h3>📊 성취기준별 정답</h3>
        <div id="over-std" class="std-list"></div>
      </div>
      <div id="over-note-wrap" class="hidden">
        <h3>📒 오답 노트</h3>
        <div id="over-note" class="note"></div>
      </div>
      <div class="btnrow">
        <button id="btn-retry" class="primary">다시 하기</button>
        <button id="btn-home">처음으로</button>
      </div>
    </div>
  </div>

  <script src="js/questions.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
